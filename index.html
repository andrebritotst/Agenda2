<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anotações</title>
<style>
  :root {
    --paper: #FBF9F4;
    --ink: #2B2A28;
    --ink-soft: #6B6862;
    --rule: #D8D3C8;
    --accent: #8A5A3B;
    --accent-soft: #E9DCCB;
    --done: #7A8B6F;
    --link: #4A6B8A;
    --link-bg: #E4EBF0;
    --font-body: Georgia, 'Iowan Old Style', serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    padding: 16px 16px 100px;
  }
  #notesView {
    background-image: repeating-linear-gradient(
      to bottom, var(--paper), var(--paper) 33px, var(--rule) 34px
    );
    background-attachment: local;
    margin: -16px -16px 0;
    padding: 16px 16px 20px;
  }
  .topbar {
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 20;
    padding: 8px 0 12px;
    margin: -8px 0 8px;
  }
  .page-title {
    font-size: 20px;
    font-weight: 700;
    margin: 0 0 10px 2px;
    color: var(--accent);
  }
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 14px;
    border-bottom: 1.5px solid var(--rule);
  }
  .tab-btn {
    border: none;
    background: none;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 8px 14px;
    cursor: pointer;
    color: var(--ink-soft);
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1.5px;
  }
  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 700;
  }
  .view { display: none; }
  .view.active { display: block; }

  .search-row { display: flex; gap: 8px; align-items: center; }
  .search-input {
    flex: 1; padding: 9px 12px; border: 1.5px solid var(--rule); border-radius: 6px;
    background: rgba(255,255,255,0.6); font-family: var(--font-body); font-size: 14px;
    color: var(--ink); outline: none;
  }
  .search-input:focus { border-color: var(--accent); }
  .clear-search { border: none; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; display: none; }
  .explore-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    padding: 4px 10px; border-radius: 12px; background: var(--link-bg); color: var(--link);
    font-size: 12.5px; cursor: pointer; border: 1px solid transparent; font-family: var(--font-body);
  }
  .chip.active { background: var(--link); color: white; }
  .filter-banner {
    display: none; align-items: center; gap: 8px; background: var(--accent-soft);
    padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; font-size: 13.5px; color: var(--ink);
  }
  .filter-banner button { border: none; background: none; color: var(--accent); cursor: pointer; font-weight: 700; font-size: 13px; }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin: 2px 2px 0; }

  .section {
    border: 1.5px solid var(--ink); border-radius: 2px; padding: 14px 16px 16px;
    margin-bottom: 22px; background: rgba(255,255,255,0.35);
  }
  .section.hidden { display: none; }
  .section-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .section-title {
    flex: 1; font-size: 17px; font-weight: 700; border: none; background: transparent;
    color: var(--ink); outline: none; font-family: var(--font-body);
  }
  .section-title::placeholder { color: var(--ink-soft); }
  .del-section { border: none; background: none; color: var(--ink-soft); font-size: 15px; cursor: pointer; padding: 2px 6px; }
  .del-section:hover { color: var(--accent); }
  .item-row { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; }
  .item-row.item-hidden { display: none; }
  .item-row input[type="checkbox"] { margin-top: 4px; width: 17px; height: 17px; accent-color: var(--done); flex-shrink: 0; }
  .item-text-wrap { flex: 1; position: relative; }
  .item-text {
    width: 100%; border: none; background: transparent; font-size: 15.5px; outline: none;
    color: var(--ink); font-family: var(--font-body); padding: 2px 0; display: block;
  }
  .item-text::placeholder { color: var(--ink-soft); }
  .item-display { font-size: 15.5px; padding: 2px 0; line-height: 1.4; cursor: text; }
  .item-row.checked .item-text, .item-row.checked .item-display { text-decoration: line-through; color: var(--ink-soft); }
  .link-tag { background: var(--link-bg); color: var(--link); padding: 1px 6px; border-radius: 4px; cursor: pointer; font-size: 14px; }
  .link-tag:hover { background: var(--link); color: white; }
  .item-row .del-item { border: none; background: none; color: var(--ink-soft); cursor: pointer; font-size: 14px; opacity: 0; padding: 2px 4px; }
  .item-row:hover .del-item { opacity: 1; }
  .add-item { border: none; background: none; color: var(--accent); font-size: 14px; cursor: pointer; margin-top: 6px; padding: 2px 0; }
  .add-section-btn {
    display: block; width: 100%; padding: 12px; border: 1.5px dashed var(--ink-soft); border-radius: 2px;
    background: none; color: var(--ink-soft); font-size: 15px; font-family: var(--font-body); cursor: pointer; margin-bottom: 20px;
  }
  .add-section-btn:hover { color: var(--accent); border-color: var(--accent); }
  .status { font-size: 11px; color: var(--ink-soft); text-align: right; min-height: 14px; }

  /* Charts view */
  .cards-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; }
  .stat-card {
    flex: 1; min-width: 90px; border: 1.5px solid var(--rule); border-radius: 8px;
    padding: 12px; text-align: center; background: rgba(255,255,255,0.5);
  }
  .stat-num { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .chart-block { margin-bottom: 28px; }
  .chart-title { font-size: 14.5px; font-weight: 700; margin-bottom: 10px; color: var(--ink); }
  .hbar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .hbar-label { width: 110px; font-size: 12.5px; color: var(--ink-soft); flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { flex: 1; height: 16px; background: var(--rule); border-radius: 4px; overflow: hidden; display: flex; }
  .hbar-done { background: var(--done); height: 100%; }
  .hbar-pending { background: var(--accent-soft); height: 100%; }
  .hbar-pct { width: 38px; font-size: 12px; color: var(--ink-soft); text-align: right; flex-shrink: 0; }
  .vbars { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding: 0 4px; }
  .vbar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .vbar-stack { width: 100%; max-width: 26px; display: flex; flex-direction: column-reverse; border-radius: 3px 3px 0 0; overflow: hidden; }
  .vbar-created { background: var(--accent-soft); width: 100%; }
  .vbar-completed { background: var(--done); width: 100%; }
  .vbar-day { font-size: 10.5px; color: var(--ink-soft); margin-top: 6px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .empty-note { font-size: 13px; color: var(--ink-soft); font-style: italic; }

  /* History view */
  .history-day { margin-bottom: 20px; }
  .history-date { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
  .history-event { display: flex; gap: 8px; align-items: baseline; font-size: 14px; padding: 4px 0; }
  .history-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
  .history-dot.created { background: var(--link); }
  .history-dot.completed { background: var(--done); }
  .history-text { flex: 1; }
  .history-time { font-size: 11px; color: var(--ink-soft); }
  .history-section-tag { font-size: 11px; color: var(--ink-soft); }

  /* Pomodoro */
  .pomo-fab {
    position: fixed; bottom: 20px; right: 20px; width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); color: white; border: none; font-size: 22px; cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.25); z-index: 30; display: flex; align-items: center; justify-content: center;
  }
  .pomo-panel {
    position: fixed; bottom: 88px; right: 20px; width: 220px; background: var(--paper);
    border: 1.5px solid var(--ink); border-radius: 10px; padding: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.2);
    z-index: 30; display: none; text-align: center;
  }
  .pomo-panel.open { display: block; }
  .pomo-mode { font-size: 12px; letter-spacing: 0.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .pomo-time { font-size: 38px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
  .pomo-controls { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .pomo-controls button {
    border: 1px solid var(--rule); background: white; color: var(--ink); padding: 6px 12px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-family: var(--font-body);
  }
  .pomo-controls button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  .pomo-settings { display: flex; gap: 8px; justify-content: center; font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
  .pomo-settings input { width: 34px; text-align: center; border: 1px solid var(--rule); border-radius: 4px; padding: 2px; font-family: var(--font-body); }
  .pomo-count { font-size: 12px; color: var(--ink-soft); }
</style>
</head>
<body>

<div class="page-title">📓 Anotações</div>
<div class="tabs">
  <button class="tab-btn active" data-tab="notesView" onclick="switchTab('notesView')">Notas</button>
  <button class="tab-btn" data-tab="chartsView" onclick="switchTab('chartsView')">Gráficos</button>
  <button class="tab-btn" data-tab="historyView" onclick="switchTab('historyView')">Histórico</button>
  <span style="flex:1"></span>
  <button class="tab-btn" onclick="exportData()" title="Baixar backup dos dados">⬇ Exportar</button>
  <button class="tab-btn" onclick="document.getElementById('importFile').click()" title="Carregar backup">⬆ Importar</button>
  <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
</div>

<div id="notesView" class="view active">
  <div class="topbar">
    <div class="search-row">
      <input class="search-input" id="searchInput" placeholder="Buscar em tudo..." oninput="onSearch()">
      <button class="clear-search" id="clearSearch" onclick="clearSearch()">limpar</button>
    </div>
    <div class="explore-bar" id="exploreBar"></div>
    <div class="hint">Dica: escreva [[Nome]] ou #tag num item para linkar — depois clique nele ou no chip acima para ver tudo relacionado.</div>
  </div>

  <div class="filter-banner" id="filterBanner">
    <span id="filterLabel"></span>
    <button onclick="clearFilter()">✕ voltar para tudo</button>
  </div>

  <div id="sections"></div>
  <button class="add-section-btn" onclick="addSection()">+ Novo assunto</button>
  <div class="status" id="status"></div>
</div>

<div id="chartsView" class="view">
  <div class="cards-row" id="statCards"></div>

  <div class="chart-block">
    <div class="chart-title">Progresso por assunto</div>
    <div id="hbars"></div>
  </div>

  <div class="chart-block">
    <div class="chart-title">Atividade — últimos 7 dias</div>
    <div class="legend">
      <span><i style="background:var(--accent-soft)"></i>criados</span>
      <span><i style="background:var(--done)"></i>concluídos</span>
    </div>
    <div class="vbars" id="activityChart"></div>
  </div>

  <div class="chart-block">
    <div class="chart-title">Ciclos de foco (Pomodoro) — últimos 7 dias</div>
    <div class="vbars" id="pomoChart"></div>
  </div>
</div>

<div id="historyView" class="view">
  <div id="historyList"></div>
</div>

<button class="pomo-fab" id="pomoFab" onclick="togglePomo()">🍅</button>
<div class="pomo-panel" id="pomoPanel">
  <div class="pomo-mode" id="pomoMode">FOCO</div>
  <div class="pomo-time" id="pomoTime">25:00</div>
  <div class="pomo-controls">
    <button class="primary" id="pomoStart" onclick="pomoToggle()">Iniciar</button>
    <button onclick="pomoReset()">Reiniciar</button>
  </div>
  <div class="pomo-settings">
    Foco <input type="number" id="pomoWorkMin" value="25" min="1" max="90" onchange="pomoSettingsChanged()">
    Pausa <input type="number" id="pomoBreakMin" value="5" min="1" max="30" onchange="pomoSettingsChanged()">
  </div>
  <div class="pomo-count" id="pomoCount">0 ciclos hoje</div>
</div>

<script>
let data = { sections: [] };
let activeFilter = null;
let searchTerm = '';
const STORAGE_KEY = 'anotacoes-data';

function uid() { return Math.random().toString(36).slice(2, 9); }
function nowIso() { return new Date().toISOString(); }
function dateKey(iso) { return new Date(iso).toISOString().slice(0,10); }
function fmtDate(dstr) {
  const d = new Date(dstr + 'T00:00:00');
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', weekday: 'short' });
}
function fmtTime(iso) {
  return new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

/* ---------- Tabs ---------- */
function switchTab(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelector(`.tab-btn[data-tab="${id}"]`).classList.add('active');
  if (id === 'chartsView') renderCharts();
  if (id === 'historyView') renderHistory();
}

/* ---------- Link parsing ---------- */
function extractLinks(text) {
  const links = [];
  const re = /\[\[([^\]]+)\]\]|#([^\s#]+)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const val = (m[1] || m[2]).trim();
    if (val) links.push(val);
  }
  return links;
}
function renderTextWithLinks(text) {
  const escaped = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return escaped.replace(/\[\[([^\]]+)\]\]|#([^\s#]+)/g, (match, p1, p2) => {
    const val = (p1 || p2).trim();
    return `<span class="link-tag" onclick="filterByLink('${val.replace(/'/g,"\\'")}')">${p1 ? val : '#' + val}</span>`;
  });
}
function collectAllLinks() {
  const counts = {};
  data.sections.forEach(s => {
    extractLinks(s.title || '').forEach(l => counts[l] = (counts[l]||0)+1);
    s.items.forEach(i => extractLinks(i.text || '').forEach(l => counts[l] = (counts[l]||0)+1));
  });
  return counts;
}

/* ---------- Load / Save ---------- */
async function load() {
  try {
    const res = await window.storage.get(STORAGE_KEY);
    if (res && res.value) data = JSON.parse(res.value);
  } catch (e) {}
  if (!data.sections || data.sections.length === 0) {
    const t = nowIso();
    data.sections = [
      { id: uid(), title: 'Cartas de anuência NR10', createdAt: t, items: [
        { id: uid(), text: '[[Renivaldo]]', done: false, createdAt: t, completedAt: null }
      ]},
      { id: uid(), title: 'AVETTA', createdAt: t, items: [
        { id: uid(), text: 'Levantar pendências e documentar', done: false, createdAt: t, completedAt: null },
        { id: uid(), text: 'Agendar reunião', done: false, createdAt: t, completedAt: null },
        { id: uid(), text: 'Enviar email p/ corporativo', done: false, createdAt: t, completedAt: null }
      ]}
    ];
  }
  // backfill dates for older data without them
  data.sections.forEach(s => {
    if (!s.createdAt) s.createdAt = nowIso();
    s.items.forEach(i => {
      if (!i.createdAt) i.createdAt = s.createdAt;
      if (i.done && i.completedAt === undefined) i.completedAt = null;
      if (!i.done) i.completedAt = i.completedAt || null;
    });
  });
  render();
}

async function save() {
  setStatus('salvando...');
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(data));
    setStatus('salvo ✓');
    setTimeout(() => setStatus(''), 1200);
  } catch (e) { setStatus('erro ao salvar'); }
}
function setStatus(msg) { document.getElementById('status').textContent = msg; }

/* ---------- CRUD ---------- */
function addSection() {
  data.sections.push({ id: uid(), title: '', createdAt: nowIso(), items: [{ id: uid(), text: '', done: false, createdAt: nowIso(), completedAt: null }] });
  render(); save();
}
function delSection(sid) {
  data.sections = data.sections.filter(s => s.id !== sid);
  render(); save();
}
function addItem(sid) {
  const s = data.sections.find(s => s.id === sid);
  s.items.push({ id: uid(), text: '', done: false, createdAt: nowIso(), completedAt: null });
  render(); save();
}
function delItem(sid, iid) {
  const s = data.sections.find(s => s.id === sid);
  s.items = s.items.filter(i => i.id !== iid);
  render(); save();
}
function updateTitle(sid, val) {
  const s = data.sections.find(s => s.id === sid);
  s.title = val;
  save();
  refreshExploreBar();
}
function updateItemText(sid, iid, val) {
  const s = data.sections.find(s => s.id === sid);
  const i = s.items.find(i => i.id === iid);
  i.text = val;
  save();
}
function toggleItem(sid, iid) {
  const s = data.sections.find(s => s.id === sid);
  const i = s.items.find(i => i.id === iid);
  i.done = !i.done;
  i.completedAt = i.done ? nowIso() : null;
  render(); save();
}

/* ---------- Explore / filter ---------- */
function filterByLink(val) {
  activeFilter = { type: 'link', value: val.toLowerCase() };
  searchTerm = '';
  document.getElementById('searchInput').value = '';
  applyFilters(); refreshExploreBar();
}
function clearFilter() { activeFilter = null; applyFilters(); refreshExploreBar(); }
function clearSearch() { searchTerm = ''; document.getElementById('searchInput').value = ''; applyFilters(); }
function onSearch() {
  searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
  if (searchTerm) activeFilter = null;
  applyFilters(); refreshExploreBar();
}
function refreshExploreBar() {
  const bar = document.getElementById('exploreBar');
  const counts = collectAllLinks();
  const keys = Object.keys(counts).sort((a,b) => counts[b]-counts[a]);
  bar.innerHTML = '';
  keys.forEach(k => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (activeFilter && activeFilter.value === k.toLowerCase() ? ' active' : '');
    chip.textContent = `${k} (${counts[k]})`;
    chip.onclick = () => filterByLink(k);
    bar.appendChild(chip);
  });
  document.getElementById('clearSearch').style.display = searchTerm ? 'inline' : 'none';
  const banner = document.getElementById('filterBanner');
  if (activeFilter) {
    banner.style.display = 'flex';
    document.getElementById('filterLabel').textContent = `Mostrando tudo relacionado a "${activeFilter.value}"`;
  } else banner.style.display = 'none';
}
function sectionMatches(s) {
  if (activeFilter) {
    const inTitle = extractLinks(s.title||'').some(l => l.toLowerCase() === activeFilter.value);
    const inItems = s.items.some(i => extractLinks(i.text||'').some(l => l.toLowerCase() === activeFilter.value));
    return inTitle || inItems;
  }
  if (searchTerm) {
    const inTitle = (s.title||'').toLowerCase().includes(searchTerm);
    const inItems = s.items.some(i => (i.text||'').toLowerCase().includes(searchTerm));
    return inTitle || inItems;
  }
  return true;
}
function itemMatches(i) {
  if (activeFilter) return extractLinks(i.text||'').some(l => l.toLowerCase() === activeFilter.value);
  if (searchTerm) return (i.text||'').toLowerCase().includes(searchTerm);
  return true;
}
function applyFilters() {
  document.querySelectorAll('.section').forEach(el => {
    const sid = el.dataset.sid;
    const s = data.sections.find(s => s.id === sid);
    const secMatch = sectionMatches(s);
    el.classList.toggle('hidden', (activeFilter || searchTerm) && !secMatch);
    el.querySelectorAll('.item-row').forEach(row => {
      const iid = row.dataset.iid;
      const item = s.items.find(i => i.id === iid);
      const titleHit = searchTerm && (s.title||'').toLowerCase().includes(searchTerm);
      const match = (!activeFilter && !searchTerm) || itemMatches(item) || titleHit;
      row.classList.toggle('item-hidden', (activeFilter || searchTerm) && !match);
    });
  });
  refreshExploreBar();
}

/* ---------- Render Notes ---------- */
let editingItemId = null;
function render() {
  const container = document.getElementById('sections');
  container.innerHTML = '';
  data.sections.forEach(s => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.dataset.sid = s.id;

    const header = document.createElement('div');
    header.className = 'section-header';
    const titleInput = document.createElement('input');
    titleInput.className = 'section-title';
    titleInput.placeholder = 'Nome do assunto';
    titleInput.value = s.title;
    titleInput.oninput = (e) => updateTitle(s.id, e.target.value);
    const delBtn = document.createElement('button');
    delBtn.className = 'del-section';
    delBtn.textContent = '✕';
    delBtn.onclick = () => delSection(s.id);
    header.appendChild(titleInput);
    header.appendChild(delBtn);
    sec.appendChild(header);

    s.items.forEach(i => {
      const row = document.createElement('div');
      row.className = 'item-row' + (i.done ? ' checked' : '');
      row.dataset.iid = i.id;
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = i.done;
      cb.onchange = () => toggleItem(s.id, i.id);
      const wrap = document.createElement('div');
      wrap.className = 'item-text-wrap';
      const hasLinks = /\[\[[^\]]+\]\]|#[^\s#]+/.test(i.text || '');
      if (hasLinks && editingItemId !== i.id) {
        const disp = document.createElement('div');
        disp.className = 'item-display';
        disp.innerHTML = renderTextWithLinks(i.text || '') || '<span style="color:var(--ink-soft)">item...</span>';
        disp.onclick = (e) => {
          if (e.target.classList.contains('link-tag')) return;
          editingItemId = i.id;
          render(); applyFilters();
          const inp = document.querySelector(`[data-iid="${i.id}"] .item-text`);
          if (inp) inp.focus();
        };
        wrap.appendChild(disp);
      } else {
        const text = document.createElement('input');
        text.className = 'item-text';
        text.placeholder = 'item... use [[Nome]] ou #tag para linkar';
        text.value = i.text;
        text.oninput = (e) => updateItemText(s.id, i.id, e.target.value);
        text.onblur = () => { editingItemId = null; render(); applyFilters(); };
        wrap.appendChild(text);
      }
      const delItemBtn = document.createElement('button');
      delItemBtn.className = 'del-item';
      delItemBtn.textContent = '✕';
      delItemBtn.onclick = () => delItem(s.id, i.id);
      row.appendChild(cb); row.appendChild(wrap); row.appendChild(delItemBtn);
      sec.appendChild(row);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-item';
    addBtn.textContent = '+ item';
    addBtn.onclick = () => addItem(s.id);
    sec.appendChild(addBtn);
    container.appendChild(sec);
  });
  applyFilters();
}

load();

/* ---------- Charts ---------- */
function last7Days() {
  const days = [];
  for (let k = 6; k >= 0; k--) {
    const d = new Date();
    d.setDate(d.getDate() - k);
    days.push(d.toISOString().slice(0,10));
  }
  return days;
}

function renderCharts() {
  let total = 0, done = 0;
  data.sections.forEach(s => s.items.forEach(i => { total++; if (i.done) done++; }));
  const pending = total - done;
  const pct = total ? Math.round((done/total)*100) : 0;

  document.getElementById('statCards').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">itens totais</div></div>
    <div class="stat-card"><div class="stat-num">${done}</div><div class="stat-label">concluídos</div></div>
    <div class="stat-card"><div class="stat-num">${pending}</div><div class="stat-label">pendentes</div></div>
    <div class="stat-card"><div class="stat-num">${pct}%</div><div class="stat-label">progresso</div></div>
  `;

  const hbars = document.getElementById('hbars');
  if (data.sections.length === 0) {
    hbars.innerHTML = '<div class="empty-note">Nenhum assunto ainda.</div>';
  } else {
    hbars.innerHTML = '';
    data.sections.forEach(s => {
      const t = s.items.length;
      const d = s.items.filter(i => i.done).length;
      const p = t ? Math.round((d/t)*100) : 0;
      const donePct = t ? (d/t)*100 : 0;
      const pendPct = 100 - donePct;
      const row = document.createElement('div');
      row.className = 'hbar-row';
      row.innerHTML = `
        <div class="hbar-label">${(s.title || 'sem título')}</div>
        <div class="hbar-track">
          <div class="hbar-done" style="width:${donePct}%"></div>
          <div class="hbar-pending" style="width:${pendPct}%"></div>
        </div>
        <div class="hbar-pct">${p}%</div>
      `;
      hbars.appendChild(row);
    });
  }

  // Activity last 7 days
  const days = last7Days();
  const createdByDay = {}, completedByDay = {};
  days.forEach(d => { createdByDay[d] = 0; completedByDay[d] = 0; });
  data.sections.forEach(s => {
    s.items.forEach(i => {
      const ck = dateKey(i.createdAt);
      if (createdByDay[ck] !== undefined) createdByDay[ck]++;
      if (i.completedAt) {
        const dk = dateKey(i.completedAt);
        if (completedByDay[dk] !== undefined) completedByDay[dk]++;
      }
    });
  });
  const maxVal = Math.max(1, ...days.map(d => Math.max(createdByDay[d], completedByDay[d])));
  const actEl = document.getElementById('activityChart');
  actEl.innerHTML = '';
  days.forEach(d => {
    const c = createdByDay[d], k = completedByDay[d];
    const col = document.createElement('div');
    col.className = 'vbar-col';
    const stackH = 90;
    col.innerHTML = `
      <div class="vbar-stack" style="height:${stackH}px; justify-content:flex-end;">
        <div class="vbar-created" style="height:${(c/maxVal)*stackH}px" title="${c} criados"></div>
        <div class="vbar-completed" style="height:${(k/maxVal)*stackH}px" title="${k} concluídos"></div>
      </div>
      <div class="vbar-day">${new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div>
    `;
    actEl.appendChild(col);
  });

  // Pomodoro last 7 days
  renderPomoChart(days);
}

async function renderPomoChart(days) {
  let history = {};
  try {
    const res = await window.storage.get(POMO_HISTORY_KEY);
    if (res && res.value) history = JSON.parse(res.value);
  } catch (e) {}
  const maxVal = Math.max(1, ...days.map(d => history[d] || 0));
  const el = document.getElementById('pomoChart');
  el.innerHTML = '';
  days.forEach(d => {
    const v = history[d] || 0;
    const col = document.createElement('div');
    col.className = 'vbar-col';
    const stackH = 90;
    col.innerHTML = `
      <div class="vbar-stack" style="height:${stackH}px; justify-content:flex-end;">
        <div class="vbar-completed" style="height:${(v/maxVal)*stackH}px" title="${v} ciclos"></div>
      </div>
      <div class="vbar-day">${new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div>
    `;
    el.appendChild(col);
  });
}

/* ---------- History ---------- */
function renderHistory() {
  const events = [];
  data.sections.forEach(s => {
    events.push({ date: s.createdAt, type: 'created', text: `Assunto criado: "${s.title || 'sem título'}"`, section: s.title });
    s.items.forEach(i => {
      if (!i.text) return;
      events.push({ date: i.createdAt, type: 'created', text: i.text, section: s.title });
      if (i.completedAt) events.push({ date: i.completedAt, type: 'completed', text: i.text, section: s.title });
    });
  });
  events.sort((a,b) => new Date(b.date) - new Date(a.date));

  const grouped = {};
  events.forEach(e => {
    const dk = dateKey(e.date);
    if (!grouped[dk]) grouped[dk] = [];
    grouped[dk].push(e);
  });

  const list = document.getElementById('historyList');
  const dateKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));
  if (dateKeys.length === 0) {
    list.innerHTML = '<div class="empty-note">Nenhum evento registrado ainda.</div>';
    return;
  }
  list.innerHTML = '';
  dateKeys.forEach(dk => {
    const dayDiv = document.createElement('div');
    dayDiv.className = 'history-day';
    const header = document.createElement('div');
    header.className = 'history-date';
    header.textContent = fmtDate(dk);
    dayDiv.appendChild(header);
    grouped[dk].forEach(e => {
      const ev = document.createElement('div');
      ev.className = 'history-event';
      const verb = e.type === 'created' ? 'Criado' : 'Concluído';
      ev.innerHTML = `
        <span class="history-dot ${e.type}"></span>
        <span class="history-text">${verb}: ${e.text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}
          <span class="history-section-tag">— ${e.section || ''}</span>
        </span>
        <span class="history-time">${fmtTime(e.date)}</span>
      `;
      dayDiv.appendChild(ev);
    });
    list.appendChild(dayDiv);
  });
}

/* ---------- Export / Import ---------- */
async function exportData() {
  let pomoHistory = {};
  try {
    const res = await window.storage.get(POMO_HISTORY_KEY);
    if (res && res.value) pomoHistory = JSON.parse(res.value);
  } catch (e) {}
  const payload = {
    exportedAt: nowIso(),
    sections: data.sections,
    pomoHistory: pomoHistory
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `anotacoes-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setStatus('backup baixado ✓');
  setTimeout(() => setStatus(''), 1500);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload.sections) throw new Error('formato inválido');
      const replace = confirm('Importar vai SUBSTITUIR todas as anotações atuais por este backup. Continuar?');
      if (!replace) return;
      data.sections = payload.sections;
      await save();
      if (payload.pomoHistory) {
        await window.storage.set(POMO_HISTORY_KEY, JSON.stringify(payload.pomoHistory));
        await loadPomo();
      }
      render();
      setStatus('backup importado ✓');
      setTimeout(() => setStatus(''), 1500);
    } catch (err) {
      alert('Não foi possível ler esse arquivo. Verifique se é um backup exportado por este app.');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ---------- Pomodoro ---------- */
let pomoInterval = null;
let pomoSeconds = 25 * 60;
let pomoMode = 'work';
let pomoRunning = false;
let pomoCyclesToday = 0;
const POMO_HISTORY_KEY = 'anotacoes-pomo-history';

async function loadPomo() {
  try {
    const res = await window.storage.get(POMO_HISTORY_KEY);
    if (res && res.value) {
      const history = JSON.parse(res.value);
      const today = new Date().toISOString().slice(0,10);
      pomoCyclesToday = history[today] || 0;
    }
  } catch (e) {}
  updatePomoDisplay();
}
async function savePomoCycle() {
  try {
    let history = {};
    const res = await window.storage.get(POMO_HISTORY_KEY);
    if (res && res.value) history = JSON.parse(res.value);
    const today = new Date().toISOString().slice(0,10);
    history[today] = (history[today] || 0) + 1;
    await window.storage.set(POMO_HISTORY_KEY, JSON.stringify(history));
  } catch (e) {}
}

function togglePomo() { document.getElementById('pomoPanel').classList.toggle('open'); }
function pomoToggle() {
  if (pomoRunning) {
    pomoRunning = false;
    clearInterval(pomoInterval);
    document.getElementById('pomoStart').textContent = 'Continuar';
  } else {
    pomoRunning = true;
    document.getElementById('pomoStart').textContent = 'Pausar';
    pomoInterval = setInterval(pomoTick, 1000);
  }
}
function pomoTick() {
  pomoSeconds--;
  if (pomoSeconds <= 0) {
    pomoBeep();
    if (pomoMode === 'work') {
      pomoCyclesToday++;
      savePomoCycle();
      pomoMode = 'break';
      pomoSeconds = getBreakMin() * 60;
    } else {
      pomoMode = 'work';
      pomoSeconds = getWorkMin() * 60;
    }
  }
  updatePomoDisplay();
}
function pomoReset() {
  pomoRunning = false;
  clearInterval(pomoInterval);
  pomoMode = 'work';
  pomoSeconds = getWorkMin() * 60;
  document.getElementById('pomoStart').textContent = 'Iniciar';
  updatePomoDisplay();
}
function pomoSettingsChanged() {
  if (!pomoRunning) {
    pomoSeconds = (pomoMode === 'work' ? getWorkMin() : getBreakMin()) * 60;
    updatePomoDisplay();
  }
}
function getWorkMin() { return parseInt(document.getElementById('pomoWorkMin').value) || 25; }
function getBreakMin() { return parseInt(document.getElementById('pomoBreakMin').value) || 5; }
function updatePomoDisplay() {
  const mm = Math.floor(pomoSeconds / 60).toString().padStart(2,'0');
  const ss = (pomoSeconds % 60).toString().padStart(2,'0');
  document.getElementById('pomoTime').textContent = `${mm}:${ss}`;
  document.getElementById('pomoMode').textContent = pomoMode === 'work' ? 'FOCO' : 'PAUSA';
  document.getElementById('pomoCount').textContent = `${pomoCyclesToday} ciclo(s) hoje`;
  document.title = pomoRunning ? `${mm}:${ss} · ${pomoMode==='work'?'Foco':'Pausa'}` : '📓 Anotações';
}
function pomoBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    o.start();
    o.stop(ctx.currentTime + 0.4);
  } catch (e) {}
}
loadPomo();
